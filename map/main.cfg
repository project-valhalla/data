// Scripts.

.triggerLight = [
    local light lightState
    light = (entquery "light" "flickeringLight")
    lightState = (triggerstate $light)
    if (= $lightState 1) [
        triggerstate $light 0
    ] [
        triggerstate $light 1
    ]
    local random
    random = (+ 10 (rnd 800))
    sleep $random [
        .triggerLight
    ]
]
.triggerLight

.triggerParticles = [
    local particles light
    particles = (entquery "particles" "flickeringSparks")
    light = (entquery "light" "flickeringBlueLight")
    triggerstate $particles 1
    triggersound $particles 3
    triggerstate $light 1
    sleep 200 [
        triggerstate @particles 0
        triggerstate @light 0
    ]
    sleep (+ 20000 (rnd 10000)) [
        .triggerParticles 
    ]
]
.triggerParticles